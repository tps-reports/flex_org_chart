name: flex_org_chart_example
description: Demo app exercising every flex_org_chart v1 feature.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  # Must match flex_org_chart's own floor — see the comment in ../pubspec.yaml
  # (Matrix4.translateByDouble/scaleByDouble require vector_math 2.2.0, first
  # pinned by Flutter stable in 3.35.0).
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flex_org_chart:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

name: flex_org_chart
description: Highly customizable org chart for Flutter with flextree-based compact layout. Ported from d3-org-chart.
version: 0.1.0
repository: https://github.com/mhunter/flex_org_chart

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Already ships transitively with the Flutter SDK (via `flutter`'s own use
  # of Matrix4/Vector3); declared explicitly only so viewport_math_test.dart
  # can import Vector3 without tripping `depend_on_referenced_packages`. Not
  # a new dependency in the resolution graph — see task-9-brief.md.
  vector_math: ^2.1.4
